
name: VEDA TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Gradle
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleLiteDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEDA-TV-APK
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
